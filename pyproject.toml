[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "punishmaster"
version = "0.1.0"
description = "punishMaster 设备契约层：语义级设备接口 + MCP 设备面（虚拟设备）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.7",
]

[project.scripts]
punishmaster-server = "punishmaster.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/punishmaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
